name: AWS CDK CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4.2.2 

    - name: Setup Node.js
      uses: actions/setup-node@v4.4.0 
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Monorepo Dependencies
      run: npm install

    - name: Lint and Compile TypeScript
      run: |
        npm run frontend:build
        npm run infra:build

    # Setup AWS Credentials securely using GitHub Secret variables
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Install CDK CLI Globally
      run: npm install -g aws-cdk

    # Deploy AWS CDK Infrastructure
    - name: Deploy AWS CDK Stack
      run: |
        cd infrastructure
        cdk deploy --require-approval never

    # Retrieve output values (e.g. S3 Bucket Name for sync) from the deployed CloudFormation stack
    - name: Sync Frontend to AWS S3 & Invalidate CDN
      run: |
        # Synchronize React output folder with the S3 Hosting bucket
        aws s3 sync frontend/dist/ s3://elms-frontend-hosting-${{ secrets.AWS_ACCOUNT_ID }}/ --delete
        
        # Invalidate CloudFront distribution cache for instant updates
        aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
