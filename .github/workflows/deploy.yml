name: ELMS Terraform CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4.2.2 

    - name: Setup Node.js
      uses: actions/setup-node@v4.4.0 
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Monorepo Dependencies
      run: npm install

    - name: Build TypeScript Frontend
      run: |
        npm run frontend:build

    # Setup AWS Credentials securely using GitHub Secret variables
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    # Ensure the Terraform state S3 bucket exists before init
    - name: Create Terraform State Bucket (if not exists)
      run: |
        aws s3api create-bucket --bucket employee-leave-1 --region us-east-1 || true

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    # Deploy AWS Terraform Infrastructure
    - name: Deploy Terraform Stack
      run: |
        cd terraform
        terraform init
        terraform apply -auto-approve

    # Sync built frontend to S3 and invalidate CloudFront cache
    - name: Sync Frontend to AWS S3 & Invalidate CDN
      run: |
        # Synchronize React output folder with the S3 Hosting bucket
        aws s3 sync frontend/dist/ s3://elms-frontend-hosting-${{ secrets.AWS_ACCOUNT_ID }}/ --delete
        
        # Invalidate CloudFront distribution cache for instant updates
        aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
