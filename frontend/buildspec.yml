version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
  pre_build:
    commands:
      - echo Installing dependencies...
      - cd frontend && npm install       # <--- Crucial: Navigate into frontend first
  build:
    commands:
      - echo Build started on `date`
      - cd frontend && npm run build     # <--- Crucial: Navigate into frontend first
artifacts:
  files:
    - 'frontend/dist/**/*'              # Adjust this path based on where your build output goes