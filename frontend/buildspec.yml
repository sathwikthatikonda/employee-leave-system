version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20

  pre_build:
    commands:
      - echo "Installing frontend dependencies..."
      - cd frontend && npm install

  build:
    commands:
      - echo "Building frontend application..."
      - cd frontend && npm run build

artifacts:
  base-directory: frontend/dist
  files:
    - '**/*'